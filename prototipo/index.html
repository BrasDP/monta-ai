<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monta Aí: protótipo de telas</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #222; font-family: Arial, Helvetica, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: #555; font-size: 14px; }
  .telas { display: grid; grid-template-columns: repeat(2, 520px); gap: 24px 28px; }
  @media (max-width: 1120px) { .telas { grid-template-columns: 1fr; } }
  .tela { margin: 0; }
  figcaption { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
  .janela { width: 520px; max-width: 100%; height: 380px; border: 2px solid #555; background: #fafafa; display: flex; flex-direction: column; }
  .titulo-janela { background: #ddd; border-bottom: 2px solid #555; padding: 5px 10px; font-size: 13px; font-weight: bold; }
  .corpo { flex: 1; padding: 12px 16px; font-size: 14px; overflow: hidden; }
  .corpo h2 { margin: 30px 0 10px; font-size: 26px; text-align: center; }
  .corpo h3 { margin: 4px 0 10px; font-size: 16px; }
  .corpo p { margin: 6px 0; line-height: 1.4; }
  .corpo > p:not(.passo):not(.nota) { text-align: center; }
  .passo { color: #666; font-size: 12px; }
  .opcao { border: 1px solid #999; background: #fff; padding: 7px 10px; margin: 6px 0; display: flex; align-items: center; gap: 8px; }
  .radio { width: 12px; height: 12px; border: 1px solid #555; border-radius: 50%; display: inline-block; }
  .radio.marcado { background: #555; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { border: 1px solid #999; padding: 4px 8px; background: #fff; }
  td:first-child { width: 32%; font-weight: bold; }
  .nota { font-size: 12.5px; border: 1px dashed #888; padding: 4px 8px; background: #fff; }
  ol { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45; }
  li { margin-bottom: 4px; }
  .botoes { padding: 10px 16px; border-top: 1px solid #bbb; display: flex; justify-content: flex-end; gap: 8px; }
  .botao { border: 1px solid #333; background: #cfd8ff; padding: 5px 14px; font-size: 13px; }
  .botao.sec { background: #eee; }
  body.uma { padding: 10px; }
  body.uma h1, body.uma .sub, body.uma figcaption { display: none; }
</style>
</head>
<body>
<h1>Monta Aí: protótipo de telas</h1>
<p class="sub">Rascunho das telas do sistema. Exemplo: jogos, orçamento médio e notebook.</p>
<div class="telas">
<figure class="tela" data-n="1"><figcaption>1. Tela inicial</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><h2>Monta Aí</h2><p>Sistema especialista que recomenda um computador para você.</p><p>Responda 3 perguntas e veja a recomendação e as regras usadas.</p></div><div class="botoes"><span class="botao">Começar</span></div></div></figure>
<figure class="tela" data-n="2"><figcaption>2. Pergunta 1</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><p class="passo">Pergunta 1 de 3</p><h3>Para que você vai usar o computador?</h3><div class="opcao"><span class="radio"></span>Estudo e escritório</div><div class="opcao"><span class="radio"></span>Programação</div><div class="opcao"><span class="radio marcado"></span>Jogos</div><div class="opcao"><span class="radio"></span>Edição de vídeo</div></div><div class="botoes"><span class="botao sec">Voltar</span><span class="botao">Próximo</span></div></div></figure>
<figure class="tela" data-n="3"><figcaption>3. Pergunta 2</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><p class="passo">Pergunta 2 de 3</p><h3>Quanto você pode gastar?</h3><div class="opcao"><span class="radio"></span>Até R$ 3.000</div><div class="opcao"><span class="radio marcado"></span>De R$ 3.000 a R$ 6.000</div><div class="opcao"><span class="radio"></span>Acima de R$ 6.000</div></div><div class="botoes"><span class="botao sec">Voltar</span><span class="botao">Próximo</span></div></div></figure>
<figure class="tela" data-n="4"><figcaption>4. Pergunta 3</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><p class="passo">Pergunta 3 de 3</p><h3>Você prefere desktop ou notebook?</h3><div class="opcao"><span class="radio"></span>Desktop (computador de mesa)</div><div class="opcao"><span class="radio marcado"></span>Notebook</div></div><div class="botoes"><span class="botao sec">Voltar</span><span class="botao">Ver resultado</span></div></div></figure>
<figure class="tela" data-n="5"><figcaption>5. Recomendação</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><h3>Recomendação</h3><table><tr><td>Perfil</td><td>gamer</td></tr><tr><td>Processador</td><td>intermediário (6 núcleos)</td></tr><tr><td>Memória RAM</td><td>16 GB</td></tr><tr><td>Placa de vídeo</td><td>placa intermediária</td></tr><tr><td>Armazenamento</td><td>SSD de 512 GB</td></tr></table><p class="nota">Atenção: Notebook com placa de vídeo esquenta: escolha um modelo com boa refrigeração.</p><p class="nota">Dica: No notebook não dá para trocar processador nem placa: compre pensando no futuro.</p></div><div class="botoes"><span class="botao sec">Nova consulta</span><span class="botao">Por quê?</span></div></div></figure>
<figure class="tela" data-n="6"><figcaption>6. Por quê?</figcaption><div class="janela"><div class="titulo-janela">Monta Aí</div><div class="corpo"><h3>Por quê? Regras usadas</h3><ol><li><b>R3</b>: SE uso = jogos ENTÃO perfil = gamer</li><li><b>R7</b>: SE perfil = gamer ENTÃO processador = intermediário (6 núcleos) E memoria = 16 GB E video = dedicado</li><li><b>R10</b>: SE orcamento = médio ENTÃO armazenamento = SSD de 512 GB</li><li><b>R14</b>: SE video = dedicado E orcamento = médio ENTÃO placa_de_video = placa intermediária</li><li><b>R18</b>: SE formato = notebook E video = dedicado ENTÃO mostra aviso/dica</li><li><b>R19</b>: SE formato = notebook ENTÃO mostra aviso/dica</li></ol></div><div class="botoes"><span class="botao">Voltar</span></div></div></figure>
</div>
<script>
  const n = new URLSearchParams(location.search).get("tela");
  if (n) {
    document.body.classList.add("uma");
    document.querySelectorAll(".tela").forEach(t => { if (t.dataset.n !== n) t.remove(); });
  }
</script>
</body>
</html>
