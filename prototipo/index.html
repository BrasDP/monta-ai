<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monta Aí: protótipo de telas</title>
<style>
  body { margin: 0; padding: 40px; background: #E9EBF3; color: #1F2937;
          font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .sub { color: #4A5068; margin: 0 0 32px; line-height: 1.5; max-width: 900px; }
  .telas { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .janela { margin: 0; width: 820px; max-width: 100%; }
  figcaption { font-weight: 700; color: #3730A3; margin-bottom: 8px; }
  .terminal { background: #0F1226; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(15,18,38,.25); }
  .barra { background: #1E2240; padding: 10px 14px; display: flex; gap: 8px; align-items: center; }
  .barra span { width: 12px; height: 12px; border-radius: 50%; background: #F87171; }
  .barra span:nth-child(2) { background: #FBBF24; }
  .barra span:nth-child(3) { background: #34D399; }
  .barra em { color: #A5ACD4; font-style: normal; font-size: 13px; margin-left: 10px;
               font-family: Consolas, "Courier New", monospace; }
  pre { margin: 0; padding: 18px 20px 22px; color: #E6E8F5; font-size: 14px; line-height: 1.5;
         font-family: Consolas, "Courier New", monospace; white-space: pre-wrap; }
  .digitado { color: #FBBF24; }
</style>
</head>
<body>
<h1>Monta Aí: protótipo de telas</h1>
<p class="sub">O sistema roda no terminal. Estas são as telas reais do programa <b>monta_ai.py</b>, no exemplo de um
usuário que quer um notebook para jogos com orçamento médio. Em amarelo, o que o usuário digitou.</p>
<div class="telas">
<figure class="janela">
  <figcaption>Tela 1 · Início e pergunta 1</figcaption>
  <div class="terminal">
    <div class="barra"><span></span><span></span><span></span><em>python monta_ai.py</em></div>
    <pre>============================================================
  MONTA AÍ - Sistema especialista que recomenda computadores
============================================================
Responda 3 perguntas e eu indico o computador ideal para você.

Pergunta 1 de 3: Para que você vai usar o computador?
  1) Estudo e escritório
  2) Programação
  3) Jogos
  4) Edição de vídeo
Escolha uma opção: <b class="digitado">3</b></pre>
  </div>
</figure>
<figure class="janela">
  <figcaption>Tela 2 · Perguntas 2 e 3 (com opção inválida)</figcaption>
  <div class="terminal">
    <div class="barra"><span></span><span></span><span></span><em>python monta_ai.py</em></div>
    <pre>Pergunta 2 de 3: Quanto você pode gastar?
  1) Até R$ 3.000
  2) De R$ 3.000 a R$ 6.000
  3) Acima de R$ 6.000
Escolha uma opção: <b class="digitado">5</b>
Opção inválida. Digite um número de 1 a 3.
Escolha uma opção: <b class="digitado">2</b>

Pergunta 3 de 3: Você prefere desktop ou notebook?
  1) Desktop (computador de mesa)
  2) Notebook
Escolha uma opção: <b class="digitado">2</b></pre>
  </div>
</figure>
<figure class="janela">
  <figcaption>Tela 3 · Recomendação</figcaption>
  <div class="terminal">
    <div class="barra"><span></span><span></span><span></span><em>python monta_ai.py</em></div>
    <pre>------------------------------------------------------------
  RECOMENDAÇÃO
------------------------------------------------------------
  Perfil identificado: gamer
  Processador:         intermediário (6 núcleos)
  Memória RAM:         16 GB
  Placa de vídeo:      placa intermediária
  Armazenamento:       SSD de 512 GB

  ATENÇÃO: Notebook com placa de vídeo esquenta: escolha um modelo com boa refrigeração.

  DICA: No notebook não dá para trocar processador nem placa: compre pensando no futuro.</pre>
  </div>
</figure>
<figure class="janela">
  <figcaption>Tela 4 · Explicação (por quê?)</figcaption>
  <div class="terminal">
    <div class="barra"><span></span><span></span><span></span><em>python monta_ai.py</em></div>
    <pre>------------------------------------------------------------
  POR QUÊ? Regras usadas, na ordem em que o motor aplicou:
------------------------------------------------------------
  R3: SE uso = jogos ENTÃO perfil = gamer
  R7: SE perfil = gamer ENTÃO processador = intermediário (6 núcleos) E memoria = 16 GB E video = dedicado
  R10: SE orcamento = médio ENTÃO armazenamento = SSD de 512 GB
  R14: SE video = dedicado E orcamento = médio ENTÃO placa_de_video = placa intermediária
  R18: SE formato = notebook E video = dedicado ENTÃO aviso_notebook = Notebook com placa de vídeo esquenta: escolha um modelo com boa refrigeração.
  R19: SE formato = notebook ENTÃO dica = No notebook não dá para trocar processador nem placa: compre pensando no futuro.

Deseja fazer uma nova consulta? (s/n): <b class="digitado">n</b>
Até mais!</pre>
  </div>
</figure>
</div>
</body>
</html>
