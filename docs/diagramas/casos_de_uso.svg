<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <g id="ator" stroke="#222" stroke-width="2.2" fill="none">
      <circle cx="0" cy="-48" r="14" fill="#fff"/>
      <line x1="0" y1="-34" x2="0" y2="6"/>
      <line x1="-24" y1="-20" x2="24" y2="-20"/>
      <line x1="0" y1="6" x2="-20" y2="38"/>
      <line x1="0" y1="6" x2="20" y2="38"/>
    </g>
  </defs>
  <rect width="960" height="580" fill="#fff"/>

  <!-- Fronteira do sistema -->
  <rect x="190" y="20" width="580" height="540" rx="6" fill="#F7F8FC" stroke="#444" stroke-width="1.6"/>
  <text x="480" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Sistema Monta Aí</text>

  <!-- Atores -->
  <use href="#ator" x="95" y="290"/>
  <text x="95" y="352" text-anchor="middle" font-size="15" font-weight="bold">Usuário</text>
  <use href="#ator" x="870" y="440"/>
  <text x="870" y="502" text-anchor="middle" font-size="15" font-weight="bold">Especialista</text>
  <text x="870" y="520" text-anchor="middle" font-size="15" font-weight="bold">em hardware</text>

  <!-- Associações ator - caso de uso -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="122" y1="268" x2="226" y2="222"/>
    <line x1="122" y1="300" x2="226" y2="480"/>
    <line x1="842" y1="420" x2="734" y2="396"/>
    <line x1="842" y1="440" x2="734" y2="484"/>
  </g>

  <!-- Casos de uso -->
  <g fill="#fff" stroke="#3730A3" stroke-width="1.8">
    <ellipse cx="335" cy="100" rx="110" ry="32"/>
    <ellipse cx="335" cy="215" rx="110" ry="32"/>
    <ellipse cx="335" cy="480" rx="110" ry="32"/>
    <ellipse cx="625" cy="100" rx="110" ry="32"/>
    <ellipse cx="625" cy="200" rx="110" ry="32"/>
    <ellipse cx="625" cy="290" rx="110" ry="32"/>
    <ellipse cx="625" cy="390" rx="110" ry="32"/>
    <ellipse cx="625" cy="485" rx="110" ry="32"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111">
    <text x="335" y="97">Responder</text><text x="335" y="114">questionário</text>
    <text x="335" y="212">Obter</text><text x="335" y="229">recomendação</text>
    <text x="335" y="477">Iniciar nova</text><text x="335" y="494">consulta</text>
    <text x="625" y="97">Executar inferência</text><text x="625" y="114">(encadeamento p/ frente)</text>
    <text x="625" y="197">Ver explicação</text><text x="625" y="214">(“Por quê?”)</text>
    <text x="625" y="287">Ver regras</text><text x="625" y="304">disparadas</text>
    <text x="625" y="387">Manter base de</text><text x="625" y="404">conhecimento</text>
    <text x="625" y="482">Validar</text><text x="625" y="499">recomendações</text>
  </g>

  <!-- include / extend -->
  <g stroke="#333" stroke-width="1.4" stroke-dasharray="7 5" fill="none" marker-end="url(#seta)">
    <line x1="335" y1="183" x2="335" y2="134"/>
    <line x1="420" y1="194" x2="530" y2="120"/>
    <line x1="515" y1="205" x2="446" y2="212"/>
    <line x1="530" y1="274" x2="436" y2="232"/>
    <line x1="625" y1="422" x2="625" y2="452"/>
  </g>
  <g font-size="12.5" fill="#333" font-style="italic">
    <text x="343" y="162">«include»</text>
    <text x="438" y="143">«include»</text>
    <text x="450" y="200">«extend»</text>
    <text x="440" y="270">«extend»</text>
    <text x="633" y="444">«include»</text>
  </g>
</svg>
